name: Terraform AWS VetAgenda

on:
  workflow_dispatch:

  push:
    branches:
      - feature/aws-infrastructure
      - main
    paths:
      - 'infraestructura-aws/**'
      - '.github/workflows/terraform-aws.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'infraestructura-aws/**'
      - '.github/workflows/terraform-aws.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate AWS Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Comprobar formato Terraform
        working-directory: infraestructura-aws
        run: terraform fmt -check -recursive

      - name: Inicializar Terraform
        working-directory: infraestructura-aws
        run: terraform init -backend=false

      - name: Validar configuracion Terraform
        working-directory: infraestructura-aws
        run: terraform validate

      - name: Ejecutar pruebas automatizadas
        working-directory: infraestructura-aws
        run: terraform test

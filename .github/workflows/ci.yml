
name: CI VetAgenda

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Lint
        run: flake8 app tests

      - name: Ejecutar pruebas
        run: PYTHONPATH=. pytest -q

      - name: Construir imagen Docker
        run: |
          docker build \
            -t simonvf10/vetagenda:${{ github.sha }} \
            -t simonvf10/vetagenda:latest .

      - name: Iniciar sesion en Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publicar imagen Docker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push simonvf10/vetagenda:${{ github.sha }}
          docker push simonvf10/vetagenda:latest

      - name: Desplegar en Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl --fail --silent --show-error \
            -X POST "$RENDER_DEPLOY_HOOK"
